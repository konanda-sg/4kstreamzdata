name: Generate Live Match JSON

on:
  schedule:
    # Check every hour for changes
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_livematch.py'
      - '.github/workflows/generate-livematch.yml'

permissions:
  contents: write
  actions: read

jobs:
  check-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Check if source data has changed
        id: check_source
        run: |
          echo "🔍 Checking if source data has changed..."
          
          # Fetch the current source data hash
          echo "📡 Fetching latest source data hash..."
          CURRENT_HASH=$(curl -s "https://raw.githubusercontent.com/sm-monirulislam/Upcoming-and-Live-Sports-Data/refs/heads/main/Sports_data.json" | md5sum | cut -d' ' -f1)
          echo "Current hash: $CURRENT_HASH"
          
          # Check if we have a stored hash
          if [ -f "app/json/.source_hash" ]; then
            STORED_HASH=$(cat app/json/.source_hash)
            echo "Stored hash: $STORED_HASH"
          else
            STORED_HASH=""
            echo "No stored hash found. First run!"
          fi
          
          # Compare hashes
          if [ "$CURRENT_HASH" != "$STORED_HASH" ]; then
            echo "✅ Source data has changed! Running full workflow..."
            echo "source_changed=true" >> $GITHUB_OUTPUT
            # Store the new hash
            echo "$CURRENT_HASH" > app/json/.source_hash
            echo "📝 Updated stored hash"
          else
            echo "ℹ️ Source data has not changed. Skipping workflow..."
            echo "source_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.check_source.outputs.source_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: steps.check_source.outputs.source_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Create necessary directories
        if: steps.check_source.outputs.source_changed == 'true'
        run: |
          mkdir -p scripts
          mkdir -p app/json

      - name: Run Python script to generate livematch.json
        if: steps.check_source.outputs.source_changed == 'true'
        run: |
          python scripts/generate_livematch.py
        env:
          PYTHONUNBUFFERED: 1

      - name: Validate generated JSON
        if: steps.check_source.outputs.source_changed == 'true'
        run: |
          if [ ! -f "app/json/livematch.json" ]; then
            echo "❌ Error: livematch.json was not generated!"
            exit 1
          fi
          
          echo "📊 Generated matches:"
          python -c "import json; data=json.load(open('app/json/livematch.json')); print(f'  Total matches: {len(data)}')"
          
          if [ $(cat app/json/livematch.json | wc -c) -lt 10 ]; then
            echo "❌ Error: Generated JSON file is too small or empty!"
            exit 1
          fi
          
          echo "✅ JSON validation passed"

      - name: Check for changes in generated file
        if: steps.check_source.outputs.source_changed == 'true'
        id: check_changes
        run: |
          if git status --porcelain | grep -q "app/json/livematch.json"; then
            echo "changes_detected=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected in livematch.json"
          else
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "✅ No changes detected. No commit needed."
          fi

      - name: Commit and push changes
        if: steps.check_source.outputs.source_changed == 'true' && steps.check_changes.outputs.changes_detected == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add both the generated JSON and the hash file
          git add app/json/livematch.json app/json/.source_hash
          git commit -m "chore: update live match data [skip ci]
          
          Automated update triggered by data change in source repository.
          Source: https://raw.githubusercontent.com/sm-monirulislam/Upcoming-and-Live-Sports-Data/refs/heads/main/Sports_data.json"
          
          git push origin main

      - name: Upload artifact (for debugging)
        if: steps.check_source.outputs.source_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: livematch-json
          path: app/json/livematch.json
          retention-days: 7

      - name: Print summary
        if: always()
        run: |
          echo "## 📊 Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check_source.outputs.source_changed }}" == "true" ]; then
            echo "**Status:** ✅ Data changed - Processed update" >> $GITHUB_STEP_SUMMARY
            echo "**Trigger:** Source data hash changed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ℹ️ No changes detected - Skipped" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** Source data hash unchanged" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated File:** \`app/json/livematch.json\`" >> $GITHUB_STEP_SUMMARY
          echo "**Raw URL:** https://raw.githubusercontent.com/nightbirdscompany/4kstreamzdata/main/app/json/livematch.json" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "app/json/livematch.json" ]; then
            COUNT=$(python -c "import json; print(len(json.load(open('app/json/livematch.json'))))")
            echo "**Total Matches:** $COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.check_changes.outputs.changes_detected }}" == "true" ]; then
            echo "**Commit:** ✅ Changes committed and pushed" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check_source.outputs.source_changed }}" == "true" ]; then
            echo "**Commit:** ℹ️ No changes to commit" >> $GITHUB_STEP_SUMMARY
          fi
